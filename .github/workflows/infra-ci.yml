name: infra-ci

on:
  push:
    branches: [main]
    paths: ["infra/**", ".github/workflows/infra-ci.yml"]
  pull_request:
    paths: ["infra/**", ".github/workflows/infra-ci.yml"]

permissions:
  contents: read
  id-token: write # OIDC for Azure + Pulumi

defaults:
  run:
    working-directory: infra

jobs:
  validate:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build # tsc --noEmit
      - run: npm test # vitest (mock-based unit/contract tests)

  preview:
    name: Pulumi preview (${{ matrix.stack }})
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      matrix:
        stack: [dev, staging, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      # Azure login via OIDC federated credentials (no stored secrets).
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: pulumi/actions@v5
        with:
          command: preview
          stack-name: ${{ matrix.stack }}
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}

  # Optional end-to-end validation on an ephemeral dev stack.
  # Enable by setting the repository variable RUN_EPHEMERAL_E2E to "true".
  ephemeral-e2e:
    name: Ephemeral up/destroy (dev)
    runs-on: ubuntu-latest
    needs: preview
    if: ${{ vars.RUN_EPHEMERAL_E2E == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: infra/package-lock.json
      - run: npm ci
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: pulumi/actions@v5
        with:
          command: up
          stack-name: dev
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
      - uses: pulumi/actions@v5
        if: always() # always tear down the ephemeral stack
        with:
          command: destroy
          stack-name: dev
          work-dir: infra
        env:
          PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_ACCESS_TOKEN }}
