name: Rust/Flutter CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: rust-flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Rust)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-flutter/backend
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-flutter/backend

      - name: Run backend checks (fmt, clippy, build, test)
        run: bash ../../scripts/ci/backend-checks.sh

      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: rust-flutter/backend

      - name: cargo deny (non-blocking)
        continue-on-error: true
        run: |
          cargo install cargo-deny --locked
          cargo deny check

  frontend:
    name: Frontend (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install melos
        run: dart pub global activate melos

      - name: Run frontend checks (analyze, format, test)
        run: bash scripts/ci/frontend-checks.sh

  backend-docker:
    name: Backend Docker image smoke test
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t planersport-backend:ci rust-flutter/backend

      - name: Run container and smoke-test /health
        run: |
          docker run -d --name backend-smoke -p 8080:8080 \
            -e DATABASE_URL=postgres://invalid:invalid@localhost:5432/invalid \
            -e PORT=8080 \
            planersport-backend:ci
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8080/health -o /dev/null; then
              echo "health check responded"; exit 0
            fi
            sleep 2
          done
          echo "health check never responded (non-2xx is acceptable if DB is unreachable, but the endpoint must respond)"
          docker logs backend-smoke
          curl -sv http://localhost:8080/health || true
          exit 1
